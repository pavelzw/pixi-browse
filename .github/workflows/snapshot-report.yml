name: Snapshot report
on:
  pull_request:
    branches:
      - main
    paths:
      - "tests/__snapshots__/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  snapshot-report:
    name: Build snapshot report
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      - name: Build snapshot report
        run: >-
          pixi run snapshot-report
          --base "${{ github.event.pull_request.base.sha }}"
          --head HEAD
      - name: Upload snapshot report
        id: upload-snapshot-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-report
          path: snapshot_report.html
          archive: false
      - name: Add snapshot report comment
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.upload-snapshot-report.outputs.artifact-id != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: snapshot-report
          message: |
            [View snapshot report](${{ steps.upload-snapshot-report.outputs.artifact-url }})
