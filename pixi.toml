[workspace]
name = "pixi-browse"
channels = ["conda-forge"]
exclude-newer = "7d"
platforms = ["osx-arm64", "linux-64", "win-64"]
preview = ["pixi-build"]

[tasks]
demo = "vhs .github/assets/demo-dark.tape && vhs .github/assets/demo-light.tape"
# Every log line also lands in textual.log (gitignored), including the debug
# detail the console below filters out, so a run can be read back afterwards.
dev = { cmd = "textual run --dev pixi_browse/__main__.py", env = { TEXTUAL_LOG = "textual.log" } }
console = "textual console -x SYSTEM -x EVENT -x DEBUG -x WORKER"

[exclude-newer]
typer = "0d"
pytest-textual-snapshot = "0d"
# The macOS 27 SDK tags its .tbd stubs with the new arm64e.x1 target, which
# libtapi only learned to skip in tapi 1600.0.11.8 build 4 (2026-09-17). Without
# it the conda-forge linker ignores libSystem and every source build of
# py-rattler fails to link. Can be dropped once that build ages past the
# workspace cutoff.
tapi = "0d"

[package]
name = "pixi-browse"
[package.build.backend]
name = "pixi-build-python"
version = "*"
[package.host-dependencies]
python = ">=3.13"
hatchling = "*"
[package.run-dependencies]
textual = ">=8.2.8,<9"
pyyaml = ">=6.0.3,<7"
# The Sigstore attestation bindings of conda/rattler#2814, which the
# attestation tab needs. Point this back at `main` once that PR has landed.
py-rattler = { git = "https://github.com/conda/rattler", branch = "codex/sigstore-python", subdirectory = "py-rattler" }
typer = ">=0.27.2,<0.28"
# Optional: side-by-side file diffs in the compare view. AGPL-3.0 licensed, so
# it is only an extra and not a run dependency of pixi-browse itself.
[package.extra-dependencies.diff]
textual-diff-view = ">=0.1.5,<0.2"
[package.run-constraints]
textual-diff-view = ">=0.1.5,<0.2"
[dependencies]
pixi-browse = { path = ".", extras = ["diff"] }
textual-dev = "*"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
mypy = "*"
ty = "*"
types-pyyaml = "*"
vhs = "*"
filelock = ">=3.32.5,<4"
pytest-textual-snapshot = ">=1.1.0"
[feature.test.tasks]
test = "pytest -n auto"
test-coverage = "pytest --cov=pixi_browse --cov-report=xml --cov-report=term-missing -n auto"
# Accept changed TUI snapshots after reviewing snapshot_report.html. Trailing
# arguments reach pytest, so `pixi run snapshot-update -k "search or compare"`
# reruns a few screens instead of all of them; snapshots the expression
# deselects are left alone rather than reported as unused.
snapshot-update = "pytest tests/test_snapshots.py tests/test_snapshots_*.py --snapshot-update"
# Compare committed TUI snapshots without rerunning the application.
snapshot-report = "python scripts/snapshot_report.py"
# Pre-download the real conda-forge artifacts of the offline test channel
# (the test session does this on demand as well).
fetch-test-channel = "python -m tests.channel_artifacts"

[feature.build.dependencies]
python = "*"
hatchling = "*"
python-build = "*"
twine = ">=6"
[feature.build.tasks]
build-wheel = "python -m build --no-isolation ."
check-wheel = "twine check dist/*"

[feature.lint.dependencies]
lefthook = "*"
ruff = "*"
prettier = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
zizmor = "*"
[feature.lint.tasks]
pre-commit-install = "lefthook install"
lint = "lefthook run pre-commit --all-files"

[feature.py313.dependencies]
python = "3.13.*"
[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = ["test", "build", "lint"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
