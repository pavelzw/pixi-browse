# Real artifacts that make up the offline test channels.
#
# The files are not committed. `tests/channel_artifacts.py` downloads them into
# the git-ignored `tests/fixtures/channels/<channel>/` directories on first use
# and verifies their SHA256, so the suite is deterministic and works offline
# afterwards. The pytest session fixture in `tests/conftest.py` then indexes
# every channel directory with py-rattler and serves them over a local HTTP
# server under the channel names below.
#
# Add an entry here and run `pixi run fetch-test-channel` to extend a channel.

[channels]
conda-forge = "https://conda.anaconda.org/conda-forge"
bioconda = "https://conda.anaconda.org/bioconda"

